name: Generate PDF documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**/*.md'
      - 'scripts/generate_docs_pdf.py'
      - '.github/workflows/generate-pdf-docs.yml'

permissions:
  contents: write

jobs:
  generate-pdf-documentation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.3 pypdf==6.0.0

      - name: Generate TR and EN PDFs
        run: python scripts/generate_docs_pdf.py

      - name: Verify generated PDF set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs/pdf/TR -maxdepth 1 -name 'TR_*.pdf' | wc -l)" -eq 21
          test "$(find docs/pdf/EN -maxdepth 1 -name 'EN_*.pdf' | wc -l)" -eq 21
          test -s docs/pdf/TR/TR_20-docker-runbook.pdf
          test -s docs/pdf/EN/EN_20-docker-runbook.pdf
          test -s docs/pdf/TR_FinWallet_Tum_Dokumanlar.pdf
          test -s docs/pdf/EN_FinWallet_All_Documents.pdf

      - name: Commit generated PDFs to pull request branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf
          if git diff --cached --quiet; then
            echo "PDF documentation is already current."
            exit 0
          fi
          git commit -m "docs: generate bilingual PDF documentation"
          git pull --rebase origin "${HEAD_REF}"
          python scripts/generate_docs_pdf.py
          git add docs/pdf
          git commit --amend --no-edit
          git push origin "HEAD:${HEAD_REF}"
