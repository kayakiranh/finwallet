name: FinWallet CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build .NET 8 solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore FinWallet.sln

      - name: Build solution
        run: dotnet build FinWallet.sln --configuration Release --no-restore --warnaserror
