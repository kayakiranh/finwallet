name: Generate Docker runbook PDFs

on:
  push:
    branches:
      - agent/docker-devops-v1
    paths:
      - 'docs/20-docker-runbook.md'
      - 'scripts/generate_docker_runbook_pdf.py'
      - '.github/workflows/generate-docker-runbook-pdf.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/20-docker-runbook.md'
      - 'scripts/generate_docker_runbook_pdf.py'
      - '.github/workflows/generate-docker-runbook-pdf.yml'

permissions:
  contents: write

jobs:
  generate-docker-runbook-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.4.3

      - name: Generate TR and EN Docker runbook PDFs
        run: python scripts/generate_docker_runbook_pdf.py

      - name: Verify generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/pdf/TR/TR_20-docker-runbook.pdf
          test -s docs/pdf/EN/EN_20-docker-runbook.pdf

      - name: Commit generated PDFs to branch
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf/TR/TR_20-docker-runbook.pdf docs/pdf/EN/EN_20-docker-runbook.pdf
          if git diff --cached --quiet; then
            echo "Docker runbook PDFs are already current."
            exit 0
          fi
          git commit -m "docs: generate Docker runbook PDFs"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
