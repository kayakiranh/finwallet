name: Generate path, error and topology PDFs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/21-happy-path.md'
      - 'docs/22-fraud-path.md'
      - 'docs/23-fail-path.md'
      - 'docs/24-error-codes.md'
      - 'docs/25-topology.md'
      - 'scripts/generate_path_error_pdfs.py'
      - 'scripts/generate_docs_pdf.py'
      - '.github/workflows/generate-path-error-pdfs.yml'

concurrency:
  group: path-error-topology-pdfs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-path-error-topology-pdfs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.3 pypdf==6.0.0

      - name: Generate TR and EN path/error/topology PDFs
        run: python scripts/generate_path_error_pdfs.py

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          for name in 21-happy-path 22-fraud-path 23-fail-path 24-error-codes 25-topology; do
            test -s "docs/pdf/TR/TR_${name}.pdf"
            test -s "docs/pdf/EN/EN_${name}.pdf"
          done

      - name: Upload generated PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: path-error-topology-pdfs
          retention-days: 14
          if-no-files-found: error
          path: |
            docs/pdf/TR/TR_21-happy-path.pdf
            docs/pdf/EN/EN_21-happy-path.pdf
            docs/pdf/TR/TR_22-fraud-path.pdf
            docs/pdf/EN/EN_22-fraud-path.pdf
            docs/pdf/TR/TR_23-fail-path.pdf
            docs/pdf/EN/EN_23-fail-path.pdf
            docs/pdf/TR/TR_24-error-codes.pdf
            docs/pdf/EN/EN_24-error-codes.pdf
            docs/pdf/TR/TR_25-topology.pdf
            docs/pdf/EN/EN_25-topology.pdf

      - name: Commit generated PDFs to pull request branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf/TR/TR_21-happy-path.pdf \
                  docs/pdf/EN/EN_21-happy-path.pdf \
                  docs/pdf/TR/TR_22-fraud-path.pdf \
                  docs/pdf/EN/EN_22-fraud-path.pdf \
                  docs/pdf/TR/TR_23-fail-path.pdf \
                  docs/pdf/EN/EN_23-fail-path.pdf \
                  docs/pdf/TR/TR_24-error-codes.pdf \
                  docs/pdf/EN/EN_24-error-codes.pdf \
                  docs/pdf/TR/TR_25-topology.pdf \
                  docs/pdf/EN/EN_25-topology.pdf
          if git diff --cached --quiet; then
            echo "Path/error/topology PDFs are already current."
            exit 0
          fi
          git commit -m "docs: generate topology PDF set"
          git push origin "HEAD:${HEAD_REF}"
